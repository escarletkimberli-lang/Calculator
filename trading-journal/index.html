<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trading Journal</title>
<meta name="description" content="Journal de trading personal: plan de negocio, trades reales, backtesting, tareas de mentoría, bitácora emocional y análisis de patrones.">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Journal">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#0d1117; --panel:#151b26; --panel2:#1c2433; --line:#2a3445; --text:#e8edf3; --muted:#8d9aab;
  --accent:#f5a524; --accent-ink:#1b1300; --blue:#6474ff; --pos:#22c55e; --neg:#f05252; --warn:#f59e0b;
  --pos-bg:rgba(34,197,94,.14); --neg-bg:rgba(240,82,82,.14); --warn-bg:rgba(245,158,11,.14); --blue-bg:rgba(100,116,255,.14);
  --radius:14px; --shadow:0 6px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f3f5f9; --panel:#ffffff; --panel2:#f0f3f8; --line:#dde3ec; --text:#18202c; --muted:#5d6b7e;
  --accent:#e08e00; --accent-ink:#fff; --blue:#4152e6; --pos:#15924a; --neg:#d63636; --warn:#c27803;
  --pos-bg:rgba(21,146,74,.1); --neg-bg:rgba(214,54,54,.1); --warn-bg:rgba(194,120,3,.12); --blue-bg:rgba(65,82,230,.1);
  --shadow:0 4px 18px rgba(20,30,50,.08);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.hidden{display:none!important}
.muted{color:var(--muted)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}
.small{font-size:.85em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 16px calc(0px);}
.topbar-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.3px}
.brand .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#ff6b3d);display:grid;place-items:center;color:#1b1300;font-weight:900}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px;cursor:pointer;white-space:nowrap}
.pill.ok{border-color:color-mix(in srgb,var(--pos) 50%,transparent);color:var(--pos)}
.pill.bad{border-color:color-mix(in srgb,var(--warn) 60%,transparent);color:var(--warn)}
.tabs{max-width:1320px;margin:8px auto 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:600}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
main{max-width:1320px;margin:0 auto;padding:18px 16px 110px}
h2.view-title{margin:0 0 4px;font-size:24px}
.view-sub{color:var(--muted);margin:0 0 16px}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;min-width:0}
.card>header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.card>header h3{margin:0;font-size:15px;font-weight:700;flex:1;min-width:0}
.card.collapsed>header{border-bottom:0}
.card.collapsed>.card-body{display:none}
.card-body{padding:14px}
.icon-btn{border:1px solid var(--line);background:var(--panel2);border-radius:9px;min-width:34px;height:34px;display:inline-grid;place-items:center;cursor:pointer;color:var(--muted);padding:0 8px}
.icon-btn:hover{color:var(--text)}
.card.collapsed .chev{transform:rotate(-90deg)}
.chev{transition:transform .15s}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel2);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;min-height:40px;text-decoration:none;color:var(--text)}
.btn:hover{filter:brightness(1.08)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 45%,transparent)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600;min-width:0}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],input[type=search],select,textarea{
  width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:40px;color:var(--text);font-weight:400;font-size:15px}
textarea{min-height:90px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:0;border-color:transparent}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.fgrid .wide{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:13.5px;user-select:none}
.chip input{display:none}
.chip:has(input:checked){background:var(--blue-bg);border-color:var(--blue);color:var(--text)}
.chip.err:has(input:checked){background:var(--neg-bg);border-color:var(--neg)}
.checklist{display:flex;flex-direction:column;gap:6px}
.checklist label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);cursor:pointer;font-size:14px}
.checklist input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--pos)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--panel2);padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
details.sec{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;background:var(--panel)}
details.sec>summary{cursor:pointer;padding:11px 14px;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"▾";color:var(--muted);transition:transform .15s}
details.sec:not([open])>summary::before{transform:rotate(-90deg)}
details.sec>.sec-body{padding:2px 14px 14px}

/* KPIs */
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.kpi .k{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:21px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}

/* bars */
.hbars{display:flex;flex-direction:column;gap:7px}
.hbar{display:grid;grid-template-columns:minmax(80px,140px) 1fr minmax(110px,auto);gap:10px;align-items:center;font-size:13px}
.hbar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .track{position:relative;height:16px;background:var(--panel2);border-radius:5px;overflow:hidden}
.hbar .fill{position:absolute;top:0;bottom:0;border-radius:4px}
.hbar .fill.p{background:var(--pos)} .hbar .fill.n{background:var(--neg)}
.hbar .mid{position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--line)}
.hbar .val{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
svg.chart{width:100%;height:auto;max-height:280px;display:block}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .h{font-size:11px;color:var(--muted);text-align:center;font-weight:700}
.cal .d{min-height:62px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);padding:5px;font-size:11px;cursor:default;display:flex;flex-direction:column;justify-content:space-between}
.cal .d.has{cursor:pointer}
.cal .d .n{color:var(--muted);font-weight:700}
.cal .d .p{font-weight:800;font-size:12px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .d.out{opacity:.3}

/* lists */
.day{margin-bottom:16px}
.day-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:12px 12px 0 0}
.day-head b{font-size:15px}
.day-body{border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;background:var(--panel)}
.trade{border-top:1px solid var(--line);padding:11px 14px}
.trade:first-child{border-top:0}
.trade-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;cursor:pointer}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--panel2)}
.tag.W{background:var(--pos-bg);color:var(--pos);border-color:transparent}
.tag.L{background:var(--neg-bg);color:var(--neg);border-color:transparent}
.tag.BE{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.tag.blue{background:var(--blue-bg);color:var(--blue);border-color:transparent}
.trade-detail{margin-top:10px;display:none}
.trade.open .trade-detail{display:block}
.textblock{white-space:pre-wrap;background:var(--panel2);border-radius:10px;padding:10px 12px;margin:4px 0 10px;font-size:14px}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;font-size:13.5px;margin-bottom:10px}
.dl div span{color:var(--muted);display:block;font-size:12px}

/* media */
.media-grid{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;width:118px;height:84px;border-radius:10px;overflow:hidden;background:var(--panel2);border:1px solid var(--line);cursor:zoom-in}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb .play{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;color:#fff;text-shadow:0 2px 8px #000;pointer-events:none}
.thumb .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;cursor:pointer;font-size:14px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.drop.over{border-color:var(--accent);background:var(--warn-bg)}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,8,14,.66);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto}
.modal-box{background:var(--bg);border:1px solid var(--line);border-radius:18px;width:min(920px,100%);box-shadow:var(--shadow);margin:auto 0}
.modal-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);border-radius:18px 18px 0 0;z-index:2}
.modal-head h3{margin:0;flex:1;font-size:18px}
#modalBody{padding:16px}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--bg);border-radius:0 0 18px 18px;flex-wrap:wrap}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:16px}
.lightbox img,.lightbox video{max-width:100%;max-height:92vh;border-radius:8px}
.lightbox .close{position:absolute;top:14px;right:14px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:70;background:var(--panel);border:1px solid var(--line);padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.show{opacity:1}
.fab{position:fixed;right:20px;bottom:22px;z-index:30;border-radius:999px;padding:14px 20px;box-shadow:0 8px 24px rgba(0,0,0,.4);font-size:15px}

/* plan */
.plan-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.plan-title{font-size:30px;font-weight:900;margin:0;letter-spacing:.5px}
.plan-sub{font-size:20px;font-weight:800;font-style:italic;text-decoration:underline;color:var(--accent)}
.plan-cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));align-items:start}
.plan-sec .body{font-size:15px}
.plan-sec .body p{margin:0 0 4px}
.plan-sec .body ul,.plan-sec .body ol{margin:4px 0 8px;padding-left:22px}
.plan-sec .body h4{margin:10px 0 4px}
.reading .plan-sec .body{font-size:19px;line-height:1.6}
.params{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.param{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.param span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.param b{font-size:17px}

/* today status */
.light{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid var(--line)}
.light .dot{width:18px;height:18px;border-radius:50%;flex:none}
.light.go{background:var(--pos-bg)} .light.go .dot{background:var(--pos)}
.light.stop{background:var(--neg-bg)} .light.stop .dot{background:var(--neg)}
.light.wait{background:var(--warn-bg)} .light.wait .dot{background:var(--warn)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.tbl{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl th{background:var(--panel2);font-size:12px;color:var(--muted);position:sticky;top:0}
.tbl td.num,.tbl th.num{text-align:right}
.tbl tr.week td{background:var(--warn-bg);font-weight:700}
.tbl tr.clickable{cursor:pointer}
.tbl tr.clickable:hover td{background:var(--panel2)}

/* kanban */
.kanban{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));align-items:start}
.kcol{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px}
.kcol h4{margin:4px 6px 10px;display:flex;gap:8px;align-items:center}
.task{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.task .t{font-weight:700;cursor:pointer}
.task.done .t{text-decoration:line-through;color:var(--muted)}

/* AI */
.ai-grid{display:grid;gap:14px;grid-template-columns:minmax(280px,360px) minmax(0,1fr);align-items:start}
@media (max-width:900px){.ai-grid{grid-template-columns:minmax(0,1fr)}}
.finding{border-left:4px solid var(--line);background:var(--panel2);border-radius:8px;padding:9px 12px;margin-bottom:8px}
.finding b{display:block}
.finding.f-good{border-left-color:var(--pos)} .finding.f-bad{border-left-color:var(--neg)} .finding.f-pat{border-left-color:var(--blue)} .finding.f-leak{border-left-color:var(--warn)}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 13px;border-radius:12px;max-width:100%}
.msg.user{background:var(--blue-bg);align-self:flex-end}
.msg.assistant{background:var(--panel2)}
.msg h4{margin:8px 0 4px} .msg p{margin:0 0 6px} .msg ul,.msg ol{margin:4px 0 8px;padding-left:22px}
.an-item{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin-bottom:8px;cursor:pointer}
.an-item.active{border-color:var(--accent)}
.banner{padding:10px 14px;border-radius:12px;background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

@media (max-width:640px){
  .hbar{grid-template-columns:80px 1fr;}
  .hbar .val{grid-column:1/-1;text-align:left;margin-top:-4px}
  .plan-title{font-size:24px}
  .cal .d{min-height:48px}
  .fab{right:14px;bottom:14px}
}
@media print{ .topbar,.fab,.icon-btn,.btn{display:none!important} body{background:#fff;color:#000} }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand"><div class="logo">TJ</div><div><span id="brandName">Trading Journal</span><small>Plan · Journal · Backtesting · Mentoría</small></div></div>
    <div class="spacer"></div>
    <span class="pill" id="backupPill" data-action="backupPill">Respaldo…</span>
    <button class="icon-btn" data-action="toggleTheme" title="Tema claro / oscuro" aria-label="Cambiar tema">◐</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="view"></main>
<button class="btn primary fab hidden" id="fab" data-action="newTradeFab">＋ Trade</button>

<div class="modal hidden" id="modal" role="dialog" aria-modal="true">
  <div class="modal-box">
    <div class="modal-head"><h3 id="modalTitle"></h3><button class="icon-btn" data-action="closeModal" aria-label="Cerrar">✕</button></div>
    <div id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>
<div class="lightbox hidden" id="lightbox"><button class="btn close" data-action="closeLightbox">✕ Cerrar</button><div id="lbContent"></div></div>
<div id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json" class="hidden">

<script>
'use strict';
/* =========================================================
   Utilidades
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayISO = () => isoOf(new Date());
const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const num = v => { if (v === '' || v == null) return null; const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const toMin = hm => { if (!hm) return null; const [h, m] = hm.split(':').map(Number); return h * 60 + (m || 0); };
const minToHM = m => pad(Math.floor(m / 60) % 24) + ':' + pad(Math.round(m % 60));
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const sum = a => a.reduce((x, y) => x + y, 0);
const DOW = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const MONTHS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const dateObj = iso => new Date(iso + 'T12:00:00');
const dow = iso => dateObj(iso).getDay();
const fmtDate = iso => { if (!iso) return '—'; const d = dateObj(iso); return d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0, 3) + ' ' + d.getFullYear(); };
const fmtDateLong = iso => { const d = dateObj(iso); return DOW[d.getDay()] + ' ' + d.getDate() + ' de ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); };
const addDays = (iso, n) => { const d = dateObj(iso); d.setDate(d.getDate() + n); return isoOf(d); };
function money(x, sign = true) {
  if (x == null || !isFinite(x)) return '—';
  const cur = (S && S.settings.currency) || 'USD';
  const s = Math.abs(x).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

/* =========================================================
   Base de datos local (IndexedDB) — guarda todo en el navegador
   ========================================================= */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const rq = indexedDB.open('trading-journal', 1);
      rq.onupgradeneeded = () => {
        const db = rq.result;
        if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
        if (!db.objectStoreNames.contains('media')) db.createObjectStore('media', { keyPath: 'id' });
      };
      rq.onsuccess = () => { this.db = rq.result; res(); };
      rq.onerror = () => rej(rq.error);
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode); const s = t.objectStore(store); let out;
      const r = fn(s); if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  get(store, key) { return this.tx(store, 'readonly', s => s.get(key)); },
  put(store, val, key) { return this.tx(store, 'readwrite', s => key === undefined ? s.put(val) : s.put(val, key)); },
  del(store, key) { return this.tx(store, 'readwrite', s => s.delete(key)); },
  all(store) { return this.tx(store, 'readonly', s => s.getAll()); },
  keys(store) { return this.tx(store, 'readonly', s => s.getAllKeys()); },
  clear(store) { return this.tx(store, 'readwrite', s => s.clear()); },
};

const urlCache = new Map();

}

const tkey = t => t.date + ' ' + (t.time || '00:00') + ' ' + (t.created || '');

  if (t.pnl != null) { const th = S.settings.beThreshold || 0; return t.pnl > th ? 'W' : t.pnl < -th ? 'L' : 'BE'; }
  const r = t.r ?? 0; return r > 0.05 ? 'W' : r < -0.05 ? 'L' : 'BE';
}

  const c = rules.filter(r => t.rules[r.id]).length; if (!c && !t.rulesReviewed) return null;
  return c / rules.length;
}

function filterTrades({ mode = 'real', account = 'all', from = '', to = '' } = {}) {
  return S.trades.filter(t => (mode === 'both' || t.mode === mode) && (account === 'all' || t.mode !== 'real' || t.accountId === account) && (!from || t.date >= from) && (!to || t.date <= to));
}

  const curve = [], winR = [], lossR = [], allR = [];
  for (const t of ts) {
    const o = outcome(t), x = val(t, unit);

  }
  const comp = ts.map(compliance).filter(c => c != null);
  const days = {}; ts.forEach(t => { days[t.date] = (days[t.date] || 0) + val(t, unit); });
  const dayVals = Object.values(days);
  return {
    unit, n: ts.length, W, L, B, wr: W + L ? W / (W + L) : null, net, avgW: W ? gW / W : null, avgL: L ? gL / L : null,
    pf: gL ? gW / Math.abs(gL) : (gW > 0 ? Infinity : null), exp: ts.length ? net / ts.length : null, maxDD: dd, maxL: ml, maxW: mw, curve,
    avgR: avg(allR), avgWinR: avg(winR), avgLossR: avg(lossR), compliance: avg(comp), nComp: comp.length,
    days: dayVals.length, greenDays: dayVals.filter(v => v > 0).length, bestDay: dayVals.length ? Math.max(...dayVals) : null, worstDay: dayVals.length ? Math.min(...dayVals) : null,

}

  return Object.entries(g).map(([k, ts]) => { const W = ts.filter(t => outcome(t) === 'W').length, L = ts.filter(t => outcome(t) === 'L').length; const net = sum(ts.map(t => val(t, unit))); return { key: k, n: ts.length, W, L, wr: W + L ? W / (W + L) : null, net, avg: net / ts.length, trades: ts }; });
}

/* contexto de cada trade: orden en el día, revancha, etc. */

  const neg = new Set(S.settings.negEmotions);

const FLAG_INFO = {
  outside: { label: 'Operar fuera de horario', advice: p => `Opera solo entre ${p.sessionStart} y ${p.sessionEnd}. Pon una alarma de cierre y cierra TV/MT4 al terminar la sesión.` },
  overMax: { label: 'Sobreoperar (más trades del máximo diario)', advice: p => `Máximo ${p.maxTrades} trades al día: al llegar al límite cierra la plataforma, sin excepciones.` },
  revenge: { label: `Entrar antes de la espera tras una pérdida (revancha)`, advice: p => `Después de un SL espera ${p.waitMin} minutos sin abrir las apps. Usa un temporizador.` },
  after2SL: { label: 'Seguir operando después de 2 SL', advice: p => `Con 2 SL en el día, apps bloqueadas hasta las ${p.lockUntil}.` },
  afterBigWin: { label: 'Seguir operando después de TP2/TP3', advice: () => `Después de un TP2 o TP3, el día terminó: protege la ganancia hasta la próxima sesión.` },
  negEmotion: { label: 'Operar con emociones negativas', advice: () => `Si antes de entrar sientes miedo, ansiedad, FOMO o ganas de revancha, no operes: respira, relee tu plan y espera la siguiente confirmación.` },
  lowCompliance: { label: 'Entrar sin cumplir el checklist (< 70%)', advice: () => `Repasa el checklist del plan antes de cada entrada: si falta un punto clave, no hay trade.` },
  bigLoss: { label: 'Pérdidas mayores a 1.2R (stop movido / sin SL)', advice: () => `No muevas ni amplíes el stop. El SL va puesto inmediatamente y se respeta.` },
};
const TAG_ADVICE = {
  'Moví el stop': 'No muevas el stop en contra. Si dudas, cierra la plataforma después de colocar SL y TP.',
  'Entré sin confirmación': 'Espera la confirmación del paso 6 (MSS, liquidez, trampa o BOS con la 55 M5) antes de ejecutar.',
  'Aumenté lotaje por emoción': 'El lotaje se calcula antes de la sesión y no cambia. Escríbelo en un post-it junto a la pantalla.',
  'No borré órdenes pendientes': 'Al cerrar un trade, revisa y borra órdenes pendientes antes de hacer cualquier otra cosa.',
  'Cerré antes por miedo': 'Deja trabajar el trade con la gestión del plan (BE a 80–100 pts, parciales en TP1/TP2).',
  'No estaba en zona': 'Solo opera cuando el precio está en una zona Mensual/Semanal/D1/H4/H1 marcada antes de la sesión.',
};
function analyze({ from, to, mode, account }) {
  const P = S.plan.params;
  const trades = sortTrades(filterTrades({ mode, account, from, to }));
  const unit = unitFor(trades);
  const st = computeStats(trades, unit);
  const res = { from, to, mode, account, unit, stats: { ...st, curve: undefined }, curve: st.curve.map(p => p.y), good: [], bad: [], patterns: [], leaks: [], recs: [], summary: '', breakdown: {} };
  if (!trades.length) { res.summary = 'No hay trades en este período. Registra trades o cambia las fechas.'; return res; }
  const U = x => fmtU(x, unit);
  const flags = contextFlags(trades);
  const minN = trades.length >= 20 ? 3 : 2;

  // Desgloses
  const bd = {
    'Hora de entrada': groupStats(trades, t => t.time ? t.time.slice(0, 2) + ':00' : null, unit).sort((a, b) => a.key < b.key ? -1 : 1),
    'Día de la semana': groupStats(trades, t => DOW[dow(t.date)], unit).sort((a, b) => DOW.indexOf(a.key) - DOW.indexOf(b.key)),
    'Setup / confirmación': groupStats(trades, t => t.setup, unit).sort((a, b) => b.net - a.net),
    'Emoción antes de entrar': groupStats(trades, t => t.emotion, unit).sort((a, b) => b.net - a.net),
    'Dirección': groupStats(trades, t => t.direction === 'short' ? 'Corto (venta)' : 'Largo (compra)', unit),
    'Errores marcados': groupStats(trades, t => t.errors || [], unit).sort((a, b) => a.net - b.net),
  };
  res.breakdown = Object.fromEntries(Object.entries(bd).map(([k, arr]) => [k, arr.map(({ trades, ...r }) => r)]));

  // Fugas de rentabilidad (lo que te aleja de ser rentable)
  const cands = [];
  for (const f of Object.keys(FLAG_INFO)) cands.push({ key: f, label: FLAG_INFO[f].label, ts: trades.filter(t => flags[t.id][f]), advice: FLAG_INFO[f].advice(P) });
  for (const tag of S.settings.errorTags) cands.push({ key: 'tag:' + tag, label: 'Error: ' + tag, ts: trades.filter(t => (t.errors || []).includes(tag)), advice: TAG_ADVICE[tag] || `Trabaja el error "${tag}": anota en la bitácora qué lo provocó y crea una regla concreta para evitarlo.` });
  for (const c of cands) {
    if (!c.ts.length) continue;
    const net = sum(c.ts.map(t => val(t, unit)));
    const W = c.ts.filter(t => outcome(t) === 'W').length, L = c.ts.filter(t => outcome(t) === 'L').length;
    const sig = c.ts.map(t => t.id).sort().join(',');
    if (net < 0 && !res.leaks.some(l => l.sig === sig)) res.leaks.push({ sig, label: c.label, n: c.ts.length, net, wr: W + L ? W / (W + L) : null, advice: c.advice, without: st.net - net });
  }
  // fusionar duplicados obvios (misma cifra/mismo n)
  res.leaks.sort((a, b) => a.net - b.net);
  const clean = trades.filter(t => { const f = flags[t.id]; return !Object.keys(FLAG_INFO).some(k => f[k]) && !(t.errors || []).length; });
  const cleanNet = sum(clean.map(t => val(t, unit)));
  const dirty = trades.filter(t => !clean.includes(t)), dirtyNet = sum(dirty.map(t => val(t, unit)));

  // Fortalezas / debilidades
  const wr = st.wr ?? 0;
  if (st.wr != null && st.wr >= 0.5) res.good.push({ t: `Win rate sólido: ${fmtPct(st.wr)}`, d: `Ganas ${st.W} de cada ${st.W + st.L} trades con resultado.` });
  if (st.pf != null && st.pf >= 1.5) res.good.push({ t: `Profit factor de ${st.pf === Infinity ? '∞' : st.pf.toFixed(2)}`, d: 'Tus ganancias superan claramente tus pérdidas.' });
  if (st.avgWinR != null && st.avgWinR >= 2) res.good.push({ t: `Dejas correr las ganancias: ${fmtR(st.avgWinR)} por trade ganador`, d: 'Estás cerca del ratio medio de tu plan (1:4).' });
  if (st.avgLossR != null && st.avgLossR >= -1.05) res.good.push({ t: 'Respetas el stop', d: `Pérdida media de ${fmtR(st.avgLossR)} — no amplías el riesgo.` });
  if (clean.length >= minN && cleanNet > 0) res.good.push({ t: `Cuando sigues el plan, ganas: ${U(cleanNet)} en ${clean.length} trades limpios`, d: 'Los trades sin errores ni violaciones de reglas son tu ventaja real.' });
  const comp = trades.filter(t => compliance(t) != null);
  if (comp.length >= minN * 2) {
    const hi = comp.filter(t => compliance(t) >= 0.85), lo = comp.filter(t => compliance(t) < 0.85);
    if (hi.length >= minN && lo.length >= minN) {
      const ah = avg(hi.map(t => val(t, unit))), al = avg(lo.map(t => val(t, unit)));
      if (ah > al) res.patterns.push({ t: 'Cumplir el checklist mejora tus resultados', d: `Con ≥85% del checklist: promedio ${U(ah)} por trade (${hi.length} trades). Con menos: ${U(al)} (${lo.length} trades).` });
    }
  }
  if (st.wr != null && st.wr < 0.4) res.bad.push({ t: `Win rate bajo: ${fmtPct(st.wr)}`, d: 'Revisa si estás entrando sin todas las confirmaciones o fuera de zona.' });
  if (st.pf != null && st.pf < 1) res.bad.push({ t: `Profit factor menor a 1 (${st.pf.toFixed(2)})`, d: 'En este período las pérdidas superan a las ganancias.' });
  if (st.avgWinR != null && st.avgWinR < 1.5) res.bad.push({ t: `Ganancias pequeñas: ${fmtR(st.avgWinR)} por trade ganador`, d: 'Tu plan apunta a TP1 = 2R y ratio medio 1:4. ¿Estás cerrando antes por miedo?' });
  if (st.avgLossR != null && st.avgLossR < -1.1) res.bad.push({ t: `Pérdidas mayores al riesgo planeado: ${fmtR(st.avgLossR)} promedio`, d: 'Indica stops movidos, entradas sin SL o lotaje mayor al plan.' });
  if (st.maxL >= 4) res.bad.push({ t: `Racha de ${st.maxL} pérdidas seguidas`, d: 'Después de 2 pérdidas seguidas, para y revisa en la bitácora antes del siguiente trade.' });
  if (st.net > 0 && st.bestDay != null && st.bestDay > st.net * 0.6 && st.days >= 5) res.bad.push({ t: 'Dependes de un solo día', d: `Tu mejor día (${U(st.bestDay)}) es más del 60% del resultado total. La consistencia aún no está consolidada.` });

  const best = (arr) => arr.filter(g => g.n >= minN).sort((a, b) => b.net - a.net);
  for (const [name, arr] of Object.entries(bd)) {
    if (name === 'Errores marcados' || name === 'Dirección') continue;
    const s = best(arr); if (s.length < 2) continue;
    const top = s[0], bot = s[s.length - 1];
    if (top.net > 0) res.good.push({ t: `${name}: mejor = ${top.key}`, d: `${top.n} trades, ${U(top.net)}, win rate ${fmtPct(top.wr)}.` });
    if (bot.net < 0) res.bad.push({ t: `${name}: peor = ${bot.key}`, d: `${bot.n} trades, ${U(bot.net)}, win rate ${fmtPct(bot.wr)}.` });
  }
  const dir = bd['Dirección'].filter(g => g.n >= minN);
  if (dir.length === 2 && Math.abs((dir[0].wr ?? 0) - (dir[1].wr ?? 0)) >= 0.15) {
    const [a, b] = dir.sort((x, y) => (y.wr ?? 0) - (x.wr ?? 0));
    res.patterns.push({ t: `Te va mejor en ${a.key.toLowerCase()}`, d: `${a.key}: ${fmtPct(a.wr)} win rate (${U(a.net)}) vs ${b.key}: ${fmtPct(b.wr)} (${U(b.net)}).` });
  }
  // comportamiento después de perder / ganar
  const aL = trades.filter(t => flags[t.id].afterLoss), aW = trades.filter(t => flags[t.id].afterWin);
  if (aL.length >= minN) {
    const s = computeStats(aL, unit);
    if (s.wr != null && s.wr < wr - 0.12) res.patterns.push({ t: 'Después de una pérdida, tu rendimiento cae', d: `Win rate después de perder: ${fmtPct(s.wr)} (general ${fmtPct(wr)}), resultado ${U(s.net)} en ${aL.length} trades. Señal de operar en caliente.` });
    else if (s.wr != null && s.wr >= wr) res.good.push({ t: 'Te recuperas bien después de una pérdida', d: `Win rate después de perder: ${fmtPct(s.wr)}.` });
  }
  if (aW.length >= minN) {
    const s = computeStats(aW, unit);
    if (s.net < 0) res.patterns.push({ t: 'Devuelves ganancias después de ganar', d: `Los trades tomados después de un ganador suman ${U(s.net)} (${aW.length} trades). Considera cerrar el día tras el primer buen trade.` });
  }
  // nivel emocional
  const hiE = trades.filter(t => (t.emotionLevel || 0) >= 4), loE = trades.filter(t => t.emotionLevel && t.emotionLevel <= 2);
  if (hiE.length >= minN && loE.length >= minN) {
    const a = avg(hiE.map(t => val(t, unit))), b = avg(loE.map(t => val(t, unit)));
    res.patterns.push({ t: a < b ? 'La intensidad emocional alta te cuesta' : 'Operas bien incluso con intensidad emocional', d: `Intensidad 4–5: ${U(a)} por trade (${hiE.length}). Intensidad 1–2: ${U(b)} por trade (${loE.length}).` });
  }
  // primer trade del día vs resto
  const first = trades.filter(t => flags[t.id].idx === 1), rest = trades.filter(t => flags[t.id].idx > 1);
  if (first.length >= minN && rest.length >= minN) {
    const a = sum(first.map(t => val(t, unit))), b = sum(rest.map(t => val(t, unit)));
    if (b < 0 && a > 0) res.patterns.push({ t: 'Tu primer trade del día es el bueno', d: `Primer trade: ${U(a)} (${first.length}). Siguientes: ${U(b)} (${rest.length}). Menos trades = más rentabilidad.` });
  }
  // backtest vs real
  if (mode !== 'backtest') {
    const bt = filterTrades({ mode: 'backtest', from, to }), re = filterTrades({ mode: 'real', account, from, to });
    if (bt.length >= minN && re.length >= minN) {
      const sb = computeStats(bt, 'R'), sr = computeStats(re, 'R');
      if (sb.wr != null && sr.wr != null) {
        const gap = sb.wr - sr.wr;
        if (gap >= 0.1) res.patterns.push({ t: 'Brecha de ejecución: el backtesting rinde más que la cuenta real', d: `Win rate backtesting ${fmtPct(sb.wr)} vs real ${fmtPct(sr.wr)}. La estrategia funciona; la diferencia está en la ejecución y las emociones.` });
        else res.good.push({ t: 'Tu ejecución real se parece a tu backtesting', d: `Backtesting ${fmtPct(sb.wr)} vs real ${fmtPct(sr.wr)} de win rate.` });
      }
    }
  }
  // calidad del journal
  const noEmo = trades.filter(t => !t.emotion).length, noComp = trades.filter(t => compliance(t) == null).length, noShot = trades.filter(t => !(t.media || []).length).length;
  if (noEmo / trades.length > 0.4 || noComp / trades.length > 0.4) res.patterns.push({ t: 'Completa más tu journal para un mejor análisis', d: `${noEmo} trades sin emoción registrada, ${noComp} sin checklist, ${noShot} sin captura.` });

  // Recomendaciones
  res.leaks.slice(0, 4).forEach(l => res.recs.push(l.advice));
  if (st.avgWinR != null && st.avgWinR < 1.5) res.recs.push('Respeta TP1 (100 pts) y la gestión de BE del plan antes de cerrar manualmente.');
  if (!res.recs.length) res.recs.push('Sigue haciendo exactamente lo mismo: tu proceso está funcionando. Mantén el journal completo para detectar cambios a tiempo.');
  res.recs = [...new Set(res.recs)];

  // Diagnóstico
  const top = res.leaks[0];
  res.summary = `Del ${fmtDate(from || trades[0].date)} al ${fmtDate(to || trades[trades.length - 1].date)}: ${st.n} trades en ${st.days} días, win rate ${fmtPct(st.wr)}, resultado ${U(st.net)}` +
    (st.pf != null ? `, profit factor ${st.pf === Infinity ? '∞' : st.pf.toFixed(2)}` : '') + '.' +
    (top ? ` Lo que más te aleja de la rentabilidad: **${top.label.toLowerCase()}** (${top.n} trades, ${U(top.net)}).` : ' No se detectaron fugas importantes.') +
    (dirty.length && clean.length ? ` Trades limpios (siguiendo el plan): ${U(cleanNet)}; trades con errores o reglas rotas: ${U(dirtyNet)}.` : '');
  res.cleanNet = cleanNet; res.dirtyNet = dirtyNet; res.nClean = clean.length; res.nDirty = dirty.length;
  return res;
}

/* =========================================================
   Gráficos simples
   ========================================================= */
function lineChart(ys, unit, labels) {
  if (!ys || ys.length < 2) return `<div class="empty">Necesitas al menos 2 trades para ver la curva.</div>`;
  const W = 720, H = 220, pl = 64, pr = 12, pt = 12, pb = 26;
  const data = [0, ...ys];
  const min = Math.min(...data), max = Math.max(...data), rng = (max - min) || 1;
  const sx = i => pl + i / (data.length - 1) * (W - pl - pr), sy = y => pt + (1 - (y - min) / rng) * (H - pt - pb);
  const d = data.map((y, i) => (i ? 'L' : 'M') + sx(i).toFixed(1) + ' ' + sy(y).toFixed(1)).join(' ');
  const col = data[data.length - 1] >= 0 ? 'var(--pos)' : 'var(--neg)';
  const area = d + ` L${sx(data.length - 1).toFixed(1)} ${sy(Math.max(min, Math.min(0, max))).toFixed(1)} L${sx(0)} ${sy(Math.max(min, Math.min(0, max))).toFixed(1)} Z`;
  const ticks = [max, (max + min) / 2, min].map(v => `<text x="${pl - 8}" y="${sy(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${esc(fmtU(v, unit).replace('+', ''))}</text><line x1="${pl}" x2="${W - pr}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)" stroke-dasharray="3 4"/>`).join('');
  const zero = min < 0 && max > 0 ? `<line x1="${pl}" x2="${W - pr}" y1="${sy(0)}" y2="${sy(0)}" stroke="var(--muted)" stroke-width="1"/>` : '';
  const lab = labels && labels.length ? `<text x="${pl}" y="${H - 6}" font-size="11" fill="var(--muted)">${esc(labels[0])}</text><text x="${W - pr}" y="${H - 6}" font-size="11" fill="var(--muted)" text-anchor="end">${esc(labels[labels.length - 1])}</text>` : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Curva de resultados">${ticks}${zero}<path d="${area}" fill="${col}" opacity=".12"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round"/>${lab}</svg>`;
}
function hbars(rows, unit) {
  rows = rows.filter(r => r.n);
  if (!rows.length) return `<div class="empty">Sin datos todavía.</div>`;
  const maxAbs = Math.max(...rows.map(r => Math.abs(r.net))) || 1, hasNeg = rows.some(r => r.net < 0);
  return `<div class="hbars">${rows.map(r => {
    const w = Math.abs(r.net) / maxAbs * (hasNeg ? 50 : 100);
    const style = hasNeg ? (r.net >= 0 ? `left:50%;width:${w}%` : `left:${50 - w}%;width:${w}%`) : `left:0;width:${w}%`;
    return `<div class="hbar"><span class="lbl" title="${esc(r.key)}">${esc(r.key)}</span><div class="track">${hasNeg ? '<div class="mid"></div>' : ''}<div class="fill ${r.net >= 0 ? 'p' : 'n'}" style="${style}"></div></div><span class="val"><b class="${cls(r.net)}">${fmtU(r.net, unit)}</b> <span class="muted">· ${r.n}t · ${fmtPct(r.wr, 0)}</span></span></div>`;
  }).join('')}</div>`;
}

function card(key, title, body, extra = '') {
  if (S.settings.hiddenCards[key]) return '';

  return `<section class="card ${col ? 'collapsed' : ''}" data-card="${key}"><header><h3>${title}</h3>${extra}
    <button class="icon-btn" data-action="hideCard" data-key="${key}" data-title="${esc(title.replace(/<[^>]+>/g, ''))}" title="Ocultar esta sección" aria-label="Ocultar">👁</button>
    <button class="icon-btn" data-action="toggleCard" data-key="${key}" title="Contraer / expandir" aria-label="Contraer"><span class="chev">▾</span></button></header>
    <div class="card-body">${body}</div></section>`;
}
function hiddenBar(prefix) {
  const h = Object.entries(S.settings.hiddenCards).filter(([k, v]) => v && k.startsWith(prefix));
  if (!h.length) return '';
  return `<div class="row" style="margin-bottom:12px"><span class="muted small">Secciones ocultas:</span>${h.map(([k, v]) => `<button class="btn sm" data-action="showCard" data-key="${k}">👁 ${esc(typeof v === 'string' ? v : k)}</button>`).join('')}</div>`;
}
const kpi = (k, v, s = '', c = '') => `<div class="kpi"><div class="k">${k}</div><div class="v ${c}">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;
const sel = (name, opts, cur, attrs = '') => `<select name="${name}" ${attrs}>${opts.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${String(v) === String(cur ?? '') ? 'selected' : ''}>${esc(l)}</option>`; }).join('')}</select>`;
const accOpts = (all = true) => [...(all ? [['all', 'Todas las cuentas']] : []), ...S.settings.accounts.map(a => [a.id, a.name])];
function periodRange(p, from, to) {
  const t = new Date(), T = isoOf(t);
  if (p === 'week') { const d = new Date(t); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return [isoOf(d), T]; }
  if (p === 'month') return [isoOf(new Date(t.getFullYear(), t.getMonth(), 1)), T];
  if (p === 'prevmonth') return [isoOf(new Date(t.getFullYear(), t.getMonth() - 1, 1)), isoOf(new Date(t.getFullYear(), t.getMonth(), 0))];
  if (p === '3m') return [addDays(T, -91), T];
  if (p === 'year') return [t.getFullYear() + '-01-01', T];
  if (p === 'custom') return [from || '', to || ''];
  return ['', ''];
}
const PERIODS = [['week', 'Esta semana'], ['month', 'Este mes'], ['prevmonth', 'Mes pasado'], ['3m', 'Últimos 3 meses'], ['year', 'Este año'], ['all', 'Todo'], ['custom', 'Personalizado']];

/* ---------- Resumen ---------- */
function todayStatus() {
  const P = S.plan.params, T = todayISO(), now = toMin(nowHM());
  const ts = sortTrades(S.trades.filter(t => t.mode === 'real' && t.date === T && (S.ui.dash.account === 'all' || t.accountId === S.ui.dash.account)));
  const losses = ts.filter(t => outcome(t) === 'L').length, last = ts[ts.length - 1];
  const reasons = []; let state = 'go';
  if (ts.some(t => t.r != null && t.r >= P.stopAfterR)) { state = 'stop'; reasons.push('Hiciste TP2/TP3 hoy: el día terminó. Protege la ganancia.'); }
  if (losses >= 2) { state = 'stop'; reasons.push(`2 SL hoy: apps bloqueadas hasta las ${P.lockUntil}.`); }
  if (ts.length >= P.maxTrades) { state = 'stop'; reasons.push(`Llegaste al máximo de ${P.maxTrades} trades del día.`); }
  if (state !== 'stop' && last) {
    const end = toMin(last.exitTime || last.time), ready = end + P.waitMin;
    if (now < ready) { state = 'wait'; reasons.push(`${outcome(last) === 'L' ? 'Último trade fue SL. ' : ''}Espera de ${P.waitMin} min: puedes volver a las ${minToHM(ready)}.`); }
  }
  if (state === 'go' && (now < toMin(P.sessionStart) || now > toMin(P.sessionEnd))) { state = 'wait'; reasons.push(`Fuera de tu horario (${P.sessionStart}–${P.sessionEnd}).`); }

function calendar(ts, unit) {
  const months = [...new Set(ts.map(t => t.date.slice(0, 7)))].sort();
  let m = S.ui.cal || months[months.length - 1] || todayISO().slice(0, 7);
  const [y, mo] = m.split('-').map(Number);
  const first = new Date(y, mo - 1, 1), days = new Date(y, mo, 0).getDate(), off = (first.getDay() + 6) % 7;
  const byDay = {}; ts.forEach(t => { if (t.date.startsWith(m)) { byDay[t.date] = byDay[t.date] || { v: 0, n: 0 }; byDay[t.date].v += val(t, unit); byDay[t.date].n++; } });
  const maxAbs = Math.max(1e-9, ...Object.values(byDay).map(d => Math.abs(d.v)));
  let cells = ['L', 'M', 'X', 'J', 'V', 'S', 'D'].map(d => `<div class="h">${d}</div>`).join('');
  for (let i = 0; i < off; i++) cells += `<div class="d out"></div>`;
  for (let d = 1; d <= days; d++) {
    const iso = `${y}-${pad(mo)}-${pad(d)}`, x = byDay[iso];
    const bg = x ? `background:color-mix(in srgb,${x.v >= 0 ? 'var(--pos)' : 'var(--neg)'} ${Math.round(15 + 45 * Math.abs(x.v) / maxAbs)}%,var(--panel2))` : '';
    cells += `<div class="d ${x ? 'has' : ''}" style="${bg}" ${x ? `data-action="openDay" data-date="${iso}"` : ''}><span class="n">${d}</span>${x ? `<span class="p">${esc(compact(x.v, unit))}<br><span style="font-weight:500">${x.n}t</span></span>` : ''}</div>`;
  }
  const prev = isoOf(new Date(y, mo - 2, 1)).slice(0, 7), next = isoOf(new Date(y, mo, 1)).slice(0, 7);
  return `<div class="row" style="margin-bottom:8px"><button class="icon-btn" data-action="setUi" data-path="cal" data-value="${prev}">‹</button><b style="text-transform:capitalize">${MONTHS[mo - 1]} ${y}</b><button class="icon-btn" data-action="setUi" data-path="cal" data-value="${next}">›</button></div><div class="cal">${cells}</div>`;
}

/* ---------- Backtesting ---------- */
function vBacktest() {
  const F = S.ui.bt, risks = S.settings.btRisks;
  const all = sortTrades(S.trades.filter(t => t.mode === 'backtest'));
  const months = [...new Set(all.map(t => t.date.slice(0, 7)))].sort().reverse();
  let ts = F.month === 'all' ? all : all.filter(t => t.date.startsWith(F.month));
  if (F.q) { const q = F.q.toLowerCase(); ts = ts.filter(t => JSON.stringify([t.analysis, t.setup, t.lesson, t.whatHappened]).toLowerCase().includes(q)); }
  const st = computeStats(ts, 'R');
  const bal = risks.map(() => 0);
  let rows = '', wk = null, wkT = [];
  const weekOf = iso => { const d = dateObj(iso); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return isoOf(d); };
  const wkRow = () => { if (!wkT.length) return ''; const W = wkT.filter(t => outcome(t) === 'W').length, L = wkT.filter(t => outcome(t) === 'L').length, B = wkT.length - W - L; const r = sum(wkT.map(t => t.r || 0)); return `<tr class="week"><td colspan="3">Semana del ${fmtDate(wk)}</td><td class="num ${cls(r)}">${fmtR(r)}</td>${risks.map(k => `<td class="num">${fmtSPct(r * k)}</td>`).join('')}<td>${W}G/${L}P/${B}BE</td><td></td></tr>`; };
  for (const t of ts) {
    const w = weekOf(t.date);
    if (wk && w !== wk) { rows += wkRow(); wkT = []; }
    wk = w; wkT.push(t);
    risks.forEach((k, i) => bal[i] += (t.r || 0) * k);
    const o = outcome(t);
    rows += `<tr class="clickable" data-action="editTrade" data-id="${t.id}"><td>${fmtDate(t.date)}</td><td>${DOW[dow(t.date)].slice(0, 3)} ${esc(t.time || '')}</td><td>${esc(t.setup || '')}${(t.media || []).length ? ' 📎' : ''}</td><td class="num ${cls(t.r)}">${fmtR(t.r)}</td>${risks.map((k, i) => `<td class="num">${fmtSPct(bal[i])}</td>`).join('')}<td><span class="tag ${o}">${o === 'W' ? 'W' : o === 'L' ? 'L' : 'BE'}</span></td><td class="muted small" style="max-width:260px;overflow:hidden;text-overflow:ellipsis">${esc((t.analysis || t.lesson || '').slice(0, 80))}</td></tr>`;
  }
  rows += wkRow();
  const quick = `<form id="btQuick" class="fgrid" style="align-items:end">
     <label class="f">Fecha<input type="date" name="date" value="${todayISO()}" required></label>
     <label class="f">Hora<input type="time" name="time"></label>
     <label class="f">Dirección${sel('direction', [['long', 'Compra'], ['short', 'Venta']], 'long')}</label>
     <label class="f">Setup${sel('setup', ['', ...S.settings.setups], '')}</label>
     <label class="f">Resultado (R)<input type="number" step="any" name="r" placeholder="ej. 2, -1, 0" required inputmode="decimal"></label>
     <label class="f wide">Nota rápida<input type="text" name="analysis" placeholder="Qué viste, por qué entraste…"></label>
     <div class="row wide"><button class="btn primary" type="submit">＋ Agregar</button><button class="btn" type="button" data-action="newTrade" data-mode="backtest">Formulario completo (fotos, video, checklist)</button></div>
   </form>`;
  return `<h2 class="view-title">Backtesting</h2><p class="view-sub">Registra cada trade de backtest en R. La tabla calcula el balance con distintos riesgos (como tu hoja de Excel) y agrupa por semana.</p>
   ${hiddenBar('b-')}
   ${card('b-quick', '⚡ Registro rápido', quick)}
   ${card('b-sum', '📊 Resumen', `<div class="kpis">${kpi('Trades', st.n, `${st.days} días`)}${kpi('W / L / BE', `${st.W} / ${st.L} / ${st.B}`)}${kpi('Win rate', fmtPct(st.wr))}${kpi('Total', `<span class="${cls(st.net)}">${fmtR(st.net)}</span>`)}${risks.map(k => kpi(`Con riesgo ${k}%`, `<span class="${cls(st.net)}">${fmtSPct(st.net * k)}</span>`)).join('')}${kpi('Máx. drawdown', fmtR(-st.maxDD), `racha pérdidas: ${st.maxL}`)}</div>
      <div style="margin-top:12px">${lineChart(st.curve.map(p => p.y), 'R')}</div>`)}
   ${card('b-table', '🗂 Tabla de backtesting', `<div class="row" style="margin-bottom:10px">${sel('m', [['all', 'Todos los meses'], ...months.map(m => [m, MONTHS[+m.slice(5) - 1] + ' ' + m.slice(0, 4)])], F.month, 'data-change="setUi" data-path="bt.month" style="width:auto"')}<input type="search" placeholder="Buscar…" value="${esc(F.q)}" data-change="setUi" data-path="bt.q" style="width:200px"><span class="spacer"></span><button class="btn sm" data-action="exportCSV" data-mode="backtest">⬇ Exportar a Excel (CSV)</button></div>
      ${ts.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fecha</th><th>Día</th><th>Setup</th><th class="num">R</th>${risks.map(k => `<th class="num">Bal. ${k}%</th>`).join('')}<th>W/L</th><th>Nota</th></tr></thead><tbody>${rows}</tbody></table></div><div class="muted small" style="margin-top:6px">Toca una fila para editarla (agregar fotos, video, checklist…). Los riesgos se cambian en Ajustes.</div>` : '<div class="empty">Aún no hay trades de backtesting.</div>'}`)}`;
}

/* ---------- Tareas ---------- */
function vTasks() {
  const F = S.ui.tasks; let ts = S.tasks;
  if (F.q) { const q = F.q.toLowerCase(); ts = ts.filter(t => JSON.stringify(t).toLowerCase().includes(q)); }
  const col = (st, title) => {
    const items = ts.filter(t => t.status === st).sort((a, b) => (a.due || '9') < (b.due || '9') ? -1 : 1);
    return `<div class="kcol"><h4>${title} <span class="tag">${items.length}</span></h4>${items.map(t => {
      const late = t.due && t.due < todayISO() && t.status !== 'done';
      return `<div class="task ${t.status === 'done' ? 'done' : ''}"><div class="row" style="align-items:flex-start;flex-wrap:nowrap">
        <input type="checkbox" ${t.status === 'done' ? 'checked' : ''} data-change="taskDone" data-id="${t.id}" style="width:20px;height:20px;margin-top:2px;accent-color:var(--pos)" aria-label="Hecha">
        <div style="flex:1;min-width:0"><div class="t" data-action="editTask" data-id="${t.id}">${esc(t.title)}</div>
        <div class="row small muted" style="gap:6px;margin-top:3px">${t.week ? `<span class="tag blue">${esc(t.week)}</span>` : ''}${t.due ? `<span class="${late ? 'neg' : ''}">📅 ${fmtDate(t.due)}</span>` : ''}${t.priority === 'alta' ? '<span class="tag L">Alta</span>' : ''}${(t.media || []).length ? `📎 ${t.media.length}` : ''}</div>
        ${t.desc ? `<div class="small" style="margin-top:4px;white-space:pre-wrap">${esc(t.desc.slice(0, 160))}${t.desc.length > 160 ? '…' : ''}</div>` : ''}
        ${mediaGrid((t.media || []).slice(0, 3))}</div></div></div>`;
    }).join('') || '<div class="muted small" style="padding:6px">Nada aquí.</div>'}</div>`;
  };
  return `<h2 class="view-title">Tareas de mentoría</h2><p class="view-sub">Tareas de cada clase/semana, con fotos, videos y tus respuestas.</p>
   <div class="row" style="margin-bottom:14px"><input type="search" placeholder="Buscar tareas…" value="${esc(F.q)}" data-change="setUi" data-path="tasks.q" style="width:240px"><span class="spacer"></span><button class="btn primary" data-action="newTask">＋ Nueva tarea</button></div>
   <div class="kanban">${col('todo', '📌 Pendientes')}${col('doing', '⏳ En progreso')}${col('done', '✅ Hechas')}</div>`;
}

   <div class="row" style="margin-bottom:14px"><span class="spacer"></span><button class="btn primary" data-action="newLog">＋ Nueva entrada</button></div>

      <div class="row" style="margin-bottom:8px">${l.emotion ? `<span class="tag">${esc(l.emotion)}</span>` : ''}${l.cost ? `<span class="tag L">Costo: ${money(-Math.abs(l.cost))}</span>` : ''}${l.reread ? '<span class="tag W">Releído ✓</span>' : ''}</div>

}

/* ---------- Análisis IA ---------- */
function vAI() {
  const last30 = addDays(todayISO(), -30);
  const open = S.analyses.find(a => a.id === S.ui.aiOpen);
  const list = [...S.analyses].sort((a, b) => a.created < b.created ? 1 : -1).map(a => `<div class="an-item ${open && open.id === a.id ? 'active' : ''}" data-action="openAn" data-id="${a.id}">
      <div style="flex:1;min-width:0"><b>${esc(a.name || 'Análisis')}</b><div class="small muted">${fmtDate(a.from)} → ${fmtDate(a.to)} · ${{ real: 'Real', backtest: 'Backtesting', both: 'Ambos' }[a.mode]} · ${a.result.stats.n} trades</div></div>
      <b class="${cls(a.result.stats.net)}">${fmtU(a.result.stats.net, a.result.unit)}</b><button class="icon-btn" data-action="delAn" data-id="${a.id}" title="Eliminar">🗑</button></div>`).join('');
  const form = `<form id="anForm" class="fgrid" style="align-items:end">
     <label class="f">Desde<input type="date" name="from" value="${last30}" required></label>
     <label class="f">Hasta<input type="date" name="to" value="${todayISO()}" required></label>
     <label class="f">Datos${sel('mode', [['real', 'Real'], ['backtest', 'Backtesting'], ['both', 'Real + Backtesting']], 'real')}</label>
     <label class="f">Cuenta${sel('account', accOpts(), 'all')}</label>
     <label class="f wide">Nombre (opcional)<input type="text" name="name" placeholder="ej. Semana 3 de mentoría, Octubre…"></label>
     <div class="wide row"><button class="btn primary" type="submit">🔍 Analizar y guardar</button><span class="muted small">El análisis se hace en tu dispositivo: es gratis y no usa internet ni tokens.</span></div></form>`;
  return `<h2 class="view-title">Análisis con IA</h2><p class="view-sub">Elige un rango de fechas: el sistema busca patrones que se repiten, tus fortalezas, tus debilidades y lo que te aleja de la rentabilidad. Cada análisis queda guardado para que lo revisemos juntos.</p>
   <div class="ai-grid">
     <div>${card('a-new', '🆕 Nuevo análisis', form)}${card('a-list', `📂 Análisis guardados (${S.analyses.length})`, list || '<div class="muted">Aún no hay análisis guardados.</div>')}</div>
     <div style="min-width:0" class="an-main">${open ? anView(open) : '<div class="empty">Crea un análisis o abre uno guardado.</div>'}</div>
   </div>`;
}
function anView(a) {
  const r = a.result, st = r.stats, U = x => fmtU(x, r.unit);
  const prev = S.analyses.filter(x => x.id !== a.id && x.mode === a.mode && x.created < a.created).sort((x, y) => x.created < y.created ? 1 : -1)[0];
  const cmp = prev ? `<div class="small muted" style="margin-top:8px">Comparado con "${esc(prev.name || 'análisis anterior')}": win rate ${fmtPct(prev.result.stats.wr)} → <b>${fmtPct(st.wr)}</b>, resultado ${fmtU(prev.result.stats.net, prev.result.unit)} → <b>${U(st.net)}</b>.</div>` : '';
  const F = (arr, c, empty) => arr.length ? arr.map(x => `<div class="finding ${c}"><b>${esc(x.t)}</b><span class="small">${esc(x.d)}</span></div>`).join('') : `<div class="muted small">${empty}</div>`;
  const leaks = r.leaks.length ? r.leaks.map(l => `<div class="finding f-leak"><div class="row"><b style="flex:1">${esc(l.label)}</b><b class="neg">${U(l.net)}</b></div><span class="small">${l.n} trades · win rate ${fmtPct(l.wr, 0)} · sin estos trades tu resultado sería <b class="${cls(l.without)}">${U(l.without)}</b></span></div>`).join('') : '<div class="muted small">No se detectaron fugas en este período. 👏</div>';
  const bdown = Object.entries(r.breakdown).map(([k, rows]) => `<details class="sec"><summary>${esc(k)}</summary><div class="sec-body">${hbars(rows, r.unit)}</div></details>`).join('');
  const hasKey = !!S.settings.ai.apiKey;
  const chat = (a.chat || []).map((m, i) => `<div class="msg ${m.role}">${m.role === 'user' && i === 0 ? '📊 <i>Se enviaron los datos del período para análisis.</i>' : m.role === 'user' ? esc(m.content) : md(m.content)}</div>`).join('');
  return `${card('a-res', `📋 ${esc(a.name || 'Análisis')} <span class="muted small">(${fmtDate(a.from)} → ${fmtDate(a.to)})</span>`, `
     <div class="kpis">${kpi('Trades', st.n, `${st.days} días`)}${kpi('Resultado', `<span class="${cls(st.net)}">${U(st.net)}</span>`)}${kpi('Win rate', fmtPct(st.wr))}${kpi('Profit factor', st.pf == null ? '—' : st.pf === Infinity ? '∞' : st.pf.toFixed(2))}${kpi('R prom. G / P', `${fmtR(st.avgWinR)} / ${fmtR(st.avgLossR)}`)}${kpi('Cumplimiento', fmtPct(st.compliance, 0))}</div>
     <div style="margin-top:12px">${lineChart(r.curve, r.unit)}</div>
     <div class="textblock" style="margin-top:10px;white-space:normal">${md(r.summary)}</div>${cmp}
     <div class="row" style="margin-top:8px"><button class="btn sm" data-action="reAn" data-id="${a.id}">↻ Recalcular con datos actuales</button><button class="btn sm" data-action="copyAn" data-id="${a.id}">📋 Copiar resumen para pegar en Claude</button></div>`)}
   ${card('a-leaks', '🕳 Lo que te aleja de la rentabilidad', leaks)}
   <div class="grid g2">${card('a-good', '💪 Fortalezas', F(r.good, 'f-good', 'Necesito más datos para detectar fortalezas.'))}${card('a-bad', '⚠️ Debilidades', F(r.bad, 'f-bad', 'Sin debilidades claras en este período.'))}</div>
   ${card('a-pat', '🔁 Patrones que se repiten', F(r.patterns, 'f-pat', 'Sin patrones claros todavía (se necesitan más trades).'))}
   ${card('a-recs', '🎯 Plan de acción', r.recs.map((x, i) => `<div class="finding f-good row"><span style="flex:1">${esc(x)}</span><button class="btn sm" data-action="recTask" data-id="${a.id}" data-i="${i}">✅ Crear tarea</button></div>`).join(''))}
   ${card('a-bd', '🔬 Desglose detallado', bdown)}
   ${card('a-notes', '📝 Nuestras conclusiones', `<textarea rows="5" data-change="anNotes" data-id="${a.id}" placeholder="Lo que concluimos juntos, compromisos para el próximo período…">${esc(a.notes || '')}</textarea><div class="muted small">Se guarda automáticamente.</div>`)}
   ${card('a-claude', '🤖 Conversar con la IA sobre este análisis', hasKey ? `
      <div class="chat" id="chatBox">${chat || '<div class="muted small">Pide a la IA un análisis profundo de este período. Puedes seguir preguntando y la conversación queda guardada.</div>'}</div>
      <form id="chatForm" data-id="${a.id}" style="margin-top:10px"><textarea name="q" rows="3" placeholder="${chat ? 'Pregunta algo más… (ej. ¿por qué pierdo los martes?)' : '(Opcional) ¿Qué quieres que revise en especial?'}"></textarea>
        <div class="row" style="margin-top:8px"><button class="btn blue" type="submit">${chat ? 'Enviar' : '🤖 Analizar a fondo con IA'}</button><span class="muted small">Usa tu clave de API (tiene costo por uso, independiente de tu plan de Claude).</span></div></form>`
      : `<p class="small">El análisis de arriba es <b>gratis</b> y se hace en tu equipo. Si además quieres conversar con una IA sobre tus datos, tienes dos opciones:</p>
         <ol class="small"><li>Toca <b>"📋 Copiar resumen para pegar en Claude"</b> y pégalo en una conversación cuando quieras (solo usa tokens cuando tú lo decidas).</li>
         <li>O agrega tu clave de API de Anthropic en <b>Ajustes → IA</b> para chatear aquí mismo.</li></ol>`)}`;
}

  return `<h2 class="view-title">Ajustes y respaldo</h2><p class="view-sub">Personaliza tu journal, oculta lo que no uses y protege tus datos.</p>

let modalSave = null;
function openModal(title, body, saveLabel, onSave, extraFoot = '') {
  $('#modalTitle').textContent = title; $('#modalBody').innerHTML = body;
  $('#modalFoot').innerHTML = `${extraFoot}<span class="spacer"></span><button class="btn" data-action="closeModal">Cancelar</button>${onSave ? `<button class="btn primary" data-action="modalSave">${saveLabel || 'Guardar'}</button>` : ''}`;
  modalSave = onSave; $('#modal').classList.remove('hidden'); $('#modal').scrollTop = 0; document.body.style.overflow = 'hidden';

const FS = { handle: null, status: 'none' };

}
async function chooseFolder() {

async function reconnectFolder() {

let bkTimer = null;
function scheduleBackup() { updateBackupPill(); if (FS.status !== 'ok') return; clearTimeout(bkTimer); bkTimer = setTimeout(() => backupToFolder(), 2500); }
async function writeFile(dir, name, data) { const fh = await dir.getFileHandle(name, { create: true }); const w = await fh.createWritable(); await w.write(data); await w.close(); }
const mediaFileName = m => m.id + '__' + (m.name || 'archivo').replace(/[^\w.\-]+/g, '_').slice(-80);
function stateForExport() { const c = structuredClone(S); c.settings.ai = { ...c.settings.ai, apiKey: '' }; return c; }
async function backupToFolder() {
  if (!FS.handle) return;
  try {
    const root = FS.handle;
    const json = JSON.stringify({ app: 'trading-journal', version: 1, exported: new Date().toISOString(), state: stateForExport() });
    await writeFile(root, 'journal-datos.json', json);
    const hist = await root.getDirectoryHandle('historial', { create: true });
    await writeFile(hist, 'journal-' + todayISO() + '.json', json);
    const mdir = await root.getDirectoryHandle('media', { create: true });
    const have = new Set(); for await (const [name] of mdir.entries()) have.add(name.split('__')[0]);
    const ids = await DB.keys('media'); const index = [];
    for (const id of ids) {
      const m = await DB.get('media', id); if (!m) continue;
      index.push({ id, name: m.name, type: m.type, file: mediaFileName(m) });
      if (!have.has(id)) await writeFile(mdir, mediaFileName(m), m.blob);
    }
    await writeFile(root, 'media-indice.json', JSON.stringify(index));
    lastBackup = new Date().toISOString(); await DB.put('kv', lastBackup, 'lastBackup');
  } catch (e) {
    console.error(e);
    FS.status = e.name === 'NotAllowedError' || e.name === 'SecurityError' ? 'needs-permission' : 'error';
  }
  updateBackupPill();
}
async function restoreFromFolder() {
  if (!FS.handle || !confirm('Esto reemplaza los datos actuales por los de la carpeta de respaldo. ¿Continuar?')) return;
  try {
    const f = await (await FS.handle.getFileHandle('journal-datos.json')).getFile();
    const data = JSON.parse(await f.text());
    let index = []; try { index = JSON.parse(await (await (await FS.handle.getFileHandle('media-indice.json')).getFile()).text()); } catch (e) { }
    const types = Object.fromEntries(index.map(i => [i.id, i]));
    const mdir = await FS.handle.getDirectoryHandle('media', { create: true });
    const have = new Set(await DB.keys('media'));
    for await (const [name, h] of mdir.entries()) {
      const id = name.split('__')[0]; if (have.has(id) || h.kind !== 'file') continue;
      const file = await h.getFile();
      await DB.put('media', { id, blob: file, name: types[id]?.name || name.split('__').slice(1).join('__'), type: types[id]?.type || file.type, size: file.size, created: new Date().toISOString() });
    }
    const key = S.settings.ai.apiKey;
    S = migrate(data.state); S.settings.ai.apiKey = key; await save(); render(); toast('Datos restaurados desde la carpeta ✓');
  } catch (e) { toast('No se pudo restaurar: ' + e.message, 5000); }
}
function updateBackupPill() {
  const p = $('#backupPill'); if (!p || !S) return;
  const ago = iso => { if (!iso) return 'nunca'; const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 1 ? 'ahora' : m < 60 ? `hace ${m} min` : m < 1440 ? `hace ${Math.round(m / 60)} h` : `hace ${Math.round(m / 1440)} d`; };
  p.className = 'pill';
  if (FS.status === 'ok') { p.classList.add('ok'); p.textContent = '✓ Respaldo en carpeta · ' + ago(lastBackup); }
  else if (FS.status === 'needs-permission') { p.classList.add('bad'); p.textContent = '⚠ Toca para reconectar carpeta de respaldo'; }
  else if (FS.status === 'error') { p.classList.add('bad'); p.textContent = '⚠ Error de respaldo — revisar'; }
  else {
    const old = !S.settings.lastExport || (Date.now() - new Date(S.settings.lastExport)) > 7 * 864e5;
    if (old && (S.trades.length || S.tasks.length)) p.classList.add('bad');
    p.textContent = (old ? '⚠ ' : '✓ ') + 'Último respaldo: ' + ago(S.settings.lastExport);
  }
}

    for (const m of data.media || []) if (!have.has(m.id)) await DB.put('media', { id: m.id, blob: await dataURLToBlob(m.data), name: m.name, type: m.type, created: m.created });
    const key = S.settings.ai.apiKey;
    if (how === 'replace') { S = migrate(data.state); }
    else {
      const I = migrate(data.state);
      for (const k of ['trades', 'tasks', 'logbook', 'analyses']) S[k] = mergeById(S[k], I[k]);
      if ((I.plan.updated || '') > (S.plan.updated || '')) S.plan = I.plan;
      S.settings.accounts = mergeById(S.settings.accounts, I.settings.accounts);
      S.planReads = { ...I.planReads, ...S.planReads };
    }
    S.settings.ai.apiKey = key;
    await save(); render(); toast(how === 'replace' ? 'Datos restaurados ✓' : 'Datos combinados ✓');
  } catch (e) { toast('No se pudo importar: ' + e.message, 5000); }
}

function loadDemo() {
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pick = a => a[Math.floor(rnd() * a.length)];
  const acc = S.settings.accounts[0].id, rules = S.plan.rules.map(r => r.id);
  let d = addDays(todayISO(), -75), n = 0;
  while (d < todayISO()) {
    d = addDays(d, 1); const wd = dow(d); if (wd === 0 || wd === 6) continue;
    if (rnd() < 0.25) continue;
    const k = rnd() < 0.7 ? 1 : rnd() < 0.7 ? 2 : 3; let tm = 330 + Math.floor(rnd() * 150), lastL = false;
    for (let i = 0; i < k; i++) {
      const late = tm > 600, revenge = lastL && i > 0, emo = revenge ? pick(['Frustración', 'Venganza', 'Ansiedad']) : late ? pick(['FOMO', 'Aburrimiento', 'Calma']) : pick(['Calma', 'Confianza', 'Paciencia', 'Miedo', 'Calma']);
      const setup = pick(['MSS (ruptura M5/M1)', 'Toma de liquidez + ruptura', 'Trampa + ruptura', 'BOS con la 55 M5']);
      let p = 0.55; if (setup.startsWith('Toma')) p += 0.12; if (setup.startsWith('BOS')) p -= 0.15; if (late) p -= 0.25; if (revenge) p -= 0.25; if (wd === 2) p -= 0.1; if (['FOMO', 'Venganza', 'Frustración'].includes(emo)) p -= 0.1;
      const win = rnd() < p, be = !win && rnd() < 0.15;
      let r = win ? pick([1, 2, 2, 4, 1.4, 4.5]) : be ? 0 : (rnd() < 0.2 ? -1.6 : -1);
      const errors = []; if (late) errors.push('Fuera de horario'); if (revenge) errors.push('No esperé 90 min'); if (r < -1.2) errors.push('Moví el stop'); if (emo === 'FOMO') errors.push('FOMO / perseguí el precio'); if (!win && rnd() < 0.2) errors.push('Entré sin confirmación');
      const rr = {}; rules.forEach(id => { if (rnd() < (errors.length ? 0.55 : 0.92)) rr[id] = true; });
      S.trades.push({ id: uid(), demo: true, mode: 'real', accountId: acc, date: d, time: minToHM(tm), exitTime: minToHM(tm + 15 + Math.floor(rnd() * 50)), instrument: 'NAS100', direction: rnd() < 0.55 ? 'long' : 'short', lots: 2, slPoints: 50, r, points: r * 50, pnl: +(r * 300).toFixed(2), setup, zones: [pick(['H4', 'H1', 'D1'])], emotion: emo, emotionLevel: revenge ? 5 : 1 + Math.floor(rnd() * 4), emotionAfter: win ? 'Confianza' : pick(['Frustración', 'Calma', 'Miedo']), errors, rules: rr, rulesReviewed: true, analysis: 'Trade de ejemplo — ' + setup + ' en zona.', media: [], created: new Date().toISOString() });
      lastL = r < 0; tm += revenge ? 25 : 40 + Math.floor(rnd() * 80); n++;
    }
  }
  // Backtesting de julio 2023 (tu hoja de Excel)
  const bt = [[4, 0], [5, .5], [6, 0], [7, 2], [10, 2], [11, 2], [12, 2], [13, -1], [14, .5], [17, 0], [18, .5], [19, -1], [20, .5], [21, .5], [24, 2], [25, 2], [26, -1], [27, -1], [28, 2], [31, 2]];
  bt.forEach(([day, r]) => S.trades.push({ id: uid(), demo: true, mode: 'backtest', date: `2023-07-${pad(day)}`, time: '08:00', instrument: 'NAS100', direction: 'long', slPoints: 90, r, setup: 'MSS (ruptura M5/M1)', media: [], errors: [], rules: {}, created: new Date().toISOString() }));
  S.tasks.push({ id: uid(), demo: true, title: 'Backtesting de julio: NAS SL 90, TP 1:1 / 1:3', week: 'Semana 1 – Clase 1', status: 'doing', priority: 'alta', due: addDays(todayISO(), 3), desc: 'Llenar la hoja con 1 sola entrada doble y comparar riesgo 1%, 1.5% y 2%.', media: [], created: new Date().toISOString() });
  S.tasks.push({ id: uid(), demo: true, title: 'Presentar plan de negocio (KING NQ)', week: 'Semana 1', status: 'done', desc: '', media: [], created: new Date().toISOString() });
  S.logbook.push({ id: uid(), demo: true, date: addDays(todayISO(), -6), title: 'Metí lotaje por emociones', emotion: 'Frustración', cost: 650, mistake: 'Debí haberme quedado sin operar ese día solo con el parcial ganado. No borré las operaciones de abajo y perdí de más. Luego metí un lotaje por emociones. Tuve el valor de cerrar pero casi pierdo la cuenta.', lesson: 'Para mejorar debo leer mi plan de trading en el celular antes de empezar a poner órdenes.', media: [], created: new Date().toISOString() });
  save(); render(); toast(`Ejemplo cargado: ${n} trades reales + ${bt.length} de backtesting`);
}
